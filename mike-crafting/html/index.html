<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="crafting-ui" class="hidden">
        <div class="crafting-container">
            <div class="crafting-header">
                <h1 id="crafting-title">Crafting</h1>
                <button id="close-btn" onclick="closeUI()">&#10005;</button>
            </div>
            <div class="crafting-body">
                <div class="left-panel">
                    <div class="panel-title">Your Items</div>
                    <div class="inventory-grid" id="inventory-grid">
                        <!-- Populated by JS -->
                    </div>
                </div>
                <div class="right-panel">
                    <div class="panel-title">Recipes</div>
                    <div class="category-tabs" id="category-tabs">
                        <!-- Populated by JS -->
                    </div>
                    <div class="recipes-list" id="recipes-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
            <div class="crafting-footer">
                <div id="progress-container" class="hidden">
                    <div id="progress-bar"></div>
                    <span id="progress-text">Crafting...</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
